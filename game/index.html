<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpine Runway — fly the valley, thread the rings, land the runway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Alpine Runway: fly the plane through the rings and land on the runway with keyboard or mouse"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./src/config.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/world.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/render.js"></script>
<script src="./src/cockpit.js"></script>
<script src="./src/input.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
