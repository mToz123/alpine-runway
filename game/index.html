<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpine Runway — fly the valley, thread the rings, land the runway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* --- Touch controls: hidden unless <html> carries the `touch` class,
     which the game adds only on a device that reports touch input.
     A desktop browser never gets the class, so it never sees these. --- */
  #touch-ui, #touch-hint, #rotate-hint { display: none; }
  html.touch #touch-ui { display: block; }
  html.touch #touch-hint { display: block; }
  .touch-btn {
    position: fixed; z-index: 20;
    font: bold 20px/1 "Courier New", monospace; color: #ffffff;
    background: rgba(8, 14, 26, 0.55);
    border: 1.5px solid rgba(143, 245, 255, 0.55);
    border-radius: 14px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    padding: 0; cursor: pointer;
  }
  .touch-btn:active { background: rgba(143, 245, 255, 0.35); }
  /* Throttle, bottom-left, stacked: + on top. Clear of the attitude
     indicator the HUD draws at the bottom-left corner. */
  #btn-thr-up { left: 14px; bottom: 92px; width: 64px; height: 64px; }
  #btn-thr-down { left: 14px; bottom: 14px; width: 64px; height: 64px; }
  /* Pause / restart / cockpit, bottom-centre: below the aircraft, over
     terrain, clear of the HUD corners. */
  #touch-row {
    position: fixed; z-index: 20; left: 50%; bottom: 14px;
    transform: translateX(-50%); display: flex; gap: 10px;
  }
  #touch-row .touch-btn { position: static; width: 68px; height: 48px; font-size: 11px; letter-spacing: 0.5px; }
  #touch-hint {
    position: fixed; z-index: 20; left: 50%; bottom: 76px;
    transform: translateX(-50%);
    font: bold 13px/1.4 "Courier New", monospace; color: rgba(143, 245, 255, 0.85);
    text-shadow: 0 1px 3px #000; pointer-events: none; white-space: nowrap;
  }
  /* --- Rotate hint: touch device held portrait only. The game is
     landscape; portrait shrinks the whole frame to a thin strip. --- */
  html.touch.portrait #rotate-hint {
    display: flex; position: fixed; inset: 0; z-index: 30;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6, 12, 24, 0.94); color: #ffffff; text-align: center;
  }
  #rotate-hint .glyph { font-size: 84px; line-height: 1; color: #ffc357; }
  #rotate-hint h1 { font: bold 26px/1.3 "Courier New", monospace; margin: 18px 16px 8px; }
  #rotate-hint p { font: 15px/1.5 "Courier New", monospace; color: #8ff5ff; margin: 0 24px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Alpine Runway: fly the plane through the rings and land on the runway with keyboard, mouse or touch"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touch-ui">
  <button id="btn-thr-up" class="touch-btn" type="button" aria-label="Throttle up">THR +</button>
  <button id="btn-thr-down" class="touch-btn" type="button" aria-label="Throttle down">THR &minus;</button>
  <div id="touch-row">
    <button id="btn-pause" class="touch-btn" type="button" aria-label="Pause">PAUSE</button>
    <button id="btn-restart" class="touch-btn" type="button" aria-label="Restart flight">RESTART</button>
    <button id="btn-cockpit" class="touch-btn" type="button" aria-label="Toggle cockpit view">COCKPIT</button>
  </div>
</div>
<div id="touch-hint">DRAG TO STEER &nbsp;&bull;&nbsp; HOLD THR+ / THR&minus; FOR THROTTLE</div>
<div id="rotate-hint" role="status">
  <div class="glyph">&#x21bb;</div>
  <h1>PUTAR HP KE LANDSCAPE</h1>
  <p>Game ini dimainkan miring &mdash; putar HP kamu, game lanjut otomatis.</p>
</div>
<script src="./src/config.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/world.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/render.js"></script>
<script src="./src/cockpit.js"></script>
<script src="./src/input.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
